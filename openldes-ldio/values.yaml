# Default values for openldes-ldio.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: openldes/ldi-orchestrator
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Set the replicaCount to 0 or 1 (multiple instances is not yet supported)
replicaCount: 1

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: [ ]
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

config:
  orchestrator:
    directory: /ldio/pipelines
  pipelines:
    - name: occupancy-pipeline
      description: "Polls for JSON public parking occupancy data, converts to linked data, creates versions & sends to LDES server."
      input:
        name: Ldio:HttpInPoller
        config:
          url: https://data.stad.gent/api/explore/v2.1/catalog/datasets/bezetting-parkeergarages-real-time/exports/json?lang=en&timezone=Europe%2FBrussels
          cron: "0 */2 * * * *"
        adapter:
          name: Ldio:JsonToLdAdapter
          config:
            context: https://temp.org/ns/advanced-compose#
      outputs:
        - name: Ldio:HttpOut
          config:
            endpoint: http://openldes.local/ingest/occupancy
            rdf-writer:
              content-type: text/turtle

# Postgres database to be used by the LDES Client. Don't use this in production,
#    but it is useful for testing and development.
# If you don't use an LDES client in your pipeline, or if you want to use an external database,
#    you can set enabled to false and provide the connection settings in the pipeline, as described
#    in the documentation (https://openldes.github.io/Linked-Data-Interactions/3.1.1/ldio/ldio-inputs/ldio-ldes-client#postgres-properties).
postgres:
  # Don't enable the Postgres database in a production environment, but use a Postgres database that is set up separately and provide the connection settings in the pipeline.
  enabled: false
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: latest
  # Database name to create
  database: ldio
  # Password for the admin user (auto-generated if not set)
  password: ""
  # PVC storage size
  storage: 1Gi
  # Storage class name (uses default if not set)
  # storageClassName: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: { }
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: { }

podSecurityContext: { }
# fsGroup: 2000

securityContext: { }
# TODO
#  readOnlyRootFilesystem: true
#  runAsNonRoot: true
#  runAsUser: 2000
#  seccompProfile:
#    type: RuntimeDefault

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "nginx"
  annotations: { }
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: openldes.local
      paths:
        - path: /ldio
          pathType: Prefix
  tls: [ ]
    # - secretName: openldes-ldio-tls
  #   hosts:
  #     - openldes-ldio.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: { }
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
    - openldes-ldio.local
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 256Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
readinessProbe:
  httpGet:
    path: /actuator/health
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: [ ]
  # - name: foo
  #   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: [ ]
  # - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: { }

tolerations: [ ]

affinity: { }
