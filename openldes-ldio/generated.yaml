---
# Source: openldes-ldio/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-openldes-ldio
  labels:
    helm.sh/chart: openldes-ldio-0.1.0
    app.kubernetes.io/name: openldes-ldio
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
# Source: openldes-ldio/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: demo-openldes-ldio
  labels:
    helm.sh/chart: openldes-ldio-0.1.0
    app.kubernetes.io/name: openldes-ldio
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: openldes-ldio
    app.kubernetes.io/instance: demo
---
# Source: openldes-ldio/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-openldes-ldio
  labels:
    helm.sh/chart: openldes-ldio-0.1.0
    app.kubernetes.io/name: openldes-ldio
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openldes-ldio
      app.kubernetes.io/instance: demo
  template:
    metadata:
      labels:
        helm.sh/chart: openldes-ldio-0.1.0
        app.kubernetes.io/name: openldes-ldio
        app.kubernetes.io/instance: demo
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: demo-openldes-ldio
      containers:
        - name: openldes-ldio
          image: "openldes/ldi-orchestrator:1.16.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 256Mi
---
# Source: openldes-ldio/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-openldes-ldio
  labels:
    helm.sh/chart: openldes-ldio-0.1.0
    app.kubernetes.io/name: openldes-ldio
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: nginx
  rules:
    - host: "openldes.local"
      http:
        paths:
          - path: /ldio
            pathType: Prefix
            backend:
              service:
                name: demo-openldes-ldio
                port:
                  number: 8080
---
# Source: openldes-ldio/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "demo-openldes-ldio-test-connection"
  labels:
    helm.sh/chart: openldes-ldio-0.1.0
    app.kubernetes.io/name: openldes-ldio
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['demo-openldes-ldio:8080']
  restartPolicy: Never
