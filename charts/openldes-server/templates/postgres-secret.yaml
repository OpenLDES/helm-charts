{{- if .Values.postgres.enabled }}
{{- $secretName := printf "%s-postgres" (include "openldes-server.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "openldes-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existingSecret (not .Values.postgres.password) }}
  postgres-password: {{ index $existingSecret.data "postgres-password" }}
  {{- else }}
  postgres-password: {{ .Values.postgres.password | default (randAlphaNum 16) | b64enc | quote }}
  {{- end }}
{{- end }}

