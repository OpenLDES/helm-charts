# -- LDES Server application configuration
# Reference: https://openldes.github.io/LDESServer/4.0.0/how-to-run.html
config:
  server:
    # Bind address for the server
    address:

  ldesServer:
    # Public hostname used in generated URIs
    hostName: http://openldes.local
    # Use relative URLs in responses
    useRelativeUrl:
    # Port configuration
    fetch:
      port:
    ingest:
      port:
    admin:
      port:
    # Cron expression for fragmentation
    fragmentationCron:
    # ISO 8601 duration for compaction
    compactionDuration:
    # Cron expression for maintenance
    maintenanceCron:
  # PostgreSQL connection settings. Use these settings if you want to connect to a Postgres database that exists outside of this application.
  # This should be used in a production environment, with "postgres.enabled" = false.
  # When you set "postgres.enabled" to true, these values will be ignored: the url, username and password will be set to these of the Postgres that will be created
  spring:
    datasource:
      url:
      username:
      password:

  streams:
    - name: occupancy
      configuration: |
        @prefix ldes: <https://w3id.org/ldes#> .
        @prefix dcterms: <http://purl.org/dc/terms/> .
        @prefix tree: <https://w3id.org/tree#>.
        @prefix sh:   <http://www.w3.org/ns/shacl#> .
        @prefix server: <http://openldes.local/> .
        @prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .
        @prefix genericES: <http://openldes.local/occupancy/> .

        server:occupancy a ldes:EventStream ;
                                   ldes:timestampPath dcterms:created ;
                                   ldes:versionOfPath dcterms:isVersionOf ;
                                   ldes:createVersions true ;
                                   tree:shape genericES:shape .

        genericES:shape a sh:NodeShape .

      views:
        - name: by-page
          configuration: |
            @prefix tree:        <https://w3id.org/tree#>.
            @prefix xsd:         <http://www.w3.org/2001/XMLSchema#> .

            </occupancy/by-page> a tree:Node ;
              tree:viewDescription [
                a tree:ViewDescription ;
                tree:fragmentationStrategy () ;
            		tree:pageSize "50"^^xsd:integer
            ] .

        - name: by-time
          configuration: |
            @prefix tree:     <https://w3id.org/tree#>.
            @prefix xsd:      <http://www.w3.org/2001/XMLSchema#> .
            @prefix ldes:     <https://w3id.org/ldes#> .
            @prefix prov:     <http://www.w3.org/ns/prov#> .
            @prefix dcterms:  <http://purl.org/dc/terms/> .

            </occupancy/by-time> a tree:Node ;
              tree:viewDescription [
                  a tree:ViewDescription ;
                tree:fragmentationStrategy ([
                  a tree:HierarchicalTimeBasedFragmentation ;
                  tree:maxGranularity "hour" ;
                  tree:fragmentationPath dcterms:modified ;
                  ]) ;
                  tree:pageSize "50"^^xsd:integer ;
              ] .

        - name: by-location
          configuration: |
            @prefix tree:         <https://w3id.org/tree#>.
            @prefix xsd:          <http://www.w3.org/2001/XMLSchema#> .
            @prefix ldes:         <https://w3id.org/ldes#> .
            @prefix geosparql:	  <http://www.opengis.net/ont/geosparql#> .
            
            </occupancy/by-location> a tree:Node ;
              tree:viewDescription [
                  a tree:ViewDescription ;
                tree:fragmentationStrategy ([
                  a tree:GeospatialFragmentation ;
                  tree:maxZoom "14"^^xsd:integer ;
                  tree:fragmentationPath geosparql:asWKT
                  ]) ;
                  tree:pageSize "50"^^xsd:integer ;
            ] .

        - name: by-parking
          configuration: |
            @prefix tree:         <https://w3id.org/tree#>.
            @prefix xsd:          <http://www.w3.org/2001/XMLSchema#> .
            @prefix ldes:         <https://w3id.org/ldes#> .
            @prefix geosparql:	  <http://www.opengis.net/ont/geosparql#> .
            @prefix terms:        <http://purl.org/dc/terms/> .
            
            </occupancy/by-parking> a tree:Node ;
              tree:viewDescription [
                  a tree:ViewDescription ;
                tree:fragmentationStrategy ([
                  a tree:ReferenceFragmentation ;
                  tree:fragmentationPath terms:isVersionOf ;
                  tree:fragmentationKey "parking-lot"
                ]) ;
              tree:pageSize "15"^^xsd:integer ;
            ] .


# -- Additional configuration to merge into application.yml
  extraConfig: { }


# Postgres database to be used by the LDES server. Don't use this in production, but it is useful for testing and development.
# If you want to use an external database, you can set enabled to false and provide the connection settings in config.spring.datasource.
postgres:
  # Don't enable the Postgres database in a production environment!
  enabled: true
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: latest
  # Database name to create
  database: ldes
  # Password for the admin user (auto-generated if not set)
  password: ""
  # PVC storage size
  storage: 1Gi
  # Storage class name (uses default if not set)
  # storageClassName: ""

podSecurityContext: { }
# fsGroup: 2000

securityContext: { }
# TODO
#  readOnlyRootFilesystem: true
#  runAsNonRoot: true
