kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: openldes
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 8080
        hostPort: 8080
        protocol: TCP
      - containerPort: 5432
        hostPort: 5432
        protocol: TCP
      - containerPort: 8081
        hostPort: 8081
        protocol: TCP
      - containerPort: 5433
        hostPort: 5433
        protocol: TCP
